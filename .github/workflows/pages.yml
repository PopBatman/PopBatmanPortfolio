name: Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build preview
    if: github.ref == 'refs/heads/main' && vars.PORTFOLIO_PREVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_BASE_PATH: /PopBatmanPortfolio
      PORTFOLIO_PREVIEW_ENABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e

      - name: Verify export has no symbolic links
        shell: bash
        run: |
          export_link="$(find out -type l -print -quit)"
          if [[ -n "$export_link" ]]; then
            echo "::error::The static export contains a symbolic link."
            exit 1
          fi

      - name: Upload static export
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out/

  deploy:
    name: Deploy Pages preview
    if: github.ref == 'refs/heads/main' && vars.PORTFOLIO_PREVIEW_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
